html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 Arial,Helvetica,sans-serif}
#app{max-width:1450px;margin:0 auto;padding:16px}
#hdr h1{font-size:15px;margin:0 0 2px}.mut{color:var(--mut);font-size:12px}
#hdr .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
#hdr .chip{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-size:11px}#hdr .chip b{font-size:13px;display:inline;margin-right:4px}
.tabbar{display:flex;gap:4px;border-bottom:2px solid var(--bd);margin:10px 0}
#hdr .tabbar{margin:4px 0}.tabbar button{font-size:12px;border:none;border-radius:0;background:transparent;padding:4px 10px;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabbar button.on{border-bottom:2px solid var(--ac);color:var(--ac);font-weight:bold}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:2px;padding-bottom:2px;box-shadow:0 4px 6px -6px #0006;font-size:12px}
#hdr input,#hdr select,#hdr button{font-size:12px;padding:4px 7px}
input,select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 9px}
button{cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.sm{padding:3px 7px;font-size:12px}
.wrap{overflow:auto;max-height:calc(100vh - 250px);background:var(--card);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:1250px}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--mut);position:sticky;top:0;background:var(--card);z-index:4}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.hot{background:var(--hot);font-weight:bold}
.flagged td{background:var(--flagbg)!important;border-left:3px solid var(--flagbd)}
.excl td{opacity:.5}
tr.detail td{background:var(--bg)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:10px}
.dgrid div b{display:block;font-size:10px;color:var(--mut);font-weight:normal}
.atas ul{margin:4px 0;padding-left:18px;font-size:12px}
.badge{display:inline-block;background:var(--card);border:1px solid var(--flagbd);border-radius:5px;padding:1px 6px;font-size:11px}
a.sgpe{color:var(--ac);text-decoration:none}a.sgpe:hover{text-decoration:underline}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);max-width:460px;width:92%}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:var(--mut)}dialog input:not([type=checkbox]){width:100%;box-sizing:border-box}
label.chk{display:flex;align-items:center;gap:6px;font-size:13px}label.chk input{width:auto}
details{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin:12px 0}
details input{width:100%;box-sizing:border-box;margin-top:4px}

,"ata":"050-2026","rdd":false,"rddDias":0,"rddD":"","rddSaida":"","deliberacao":"InclusaoAla","deliberacaoData":"2026-07-07","tipoPrevisto":"","tipoPrevistoRef":"","flag":false,"flagN":null,"atas":[{"numero":"050/2026","tipo":"InclusaoAla","motivo":"ALTA PERICULOSIDADE","sgpe":"SEJURI 00076593/2026","data":"2026-07-07","obs":"","periodo":1,"portaria":"1465","origem":"2026"}],"rev":true}],"ui":{"t":1792527238934,"tab":"emit","atasGrp":"2026","fl":"all","srt":"ing","q":"","exp":[],"sy":0,"pw":0,"aw":0},"emDocs":{"874404":[{"rot":"DELIBERAÇÃO 034 2026","tipo":"Deliberação","txt":"ESTADO DE SANTA CATARINA\n\nSECRETARIA DE ESTADO DE JUSTIÇA E REINTEGRAÇÃO SOCIAL\n\nDEPARTAMENTO DE POLÍCIA PENAL\n\nGRUPO COLEGIADO – INCLUSÃO/EXCLUSÃO NA UNIDADE DE SEGURANÇA MÁXIMA\n\nSecretaria de Estado de Justiça e Reintegração Social\n\nRua Fúlvio Aducci, n.º 1214 – Bairro Estreito – CEP 88075-000 – Florianópolis/SC\n\npoliciapenal@pp.sc.gov.br\n\nDELIBERAÇÃO nº 034/2025 Florianópolis, 04 de maio de 2025.\n\nCLASSIFICAÇÃO: PERMANÊNCIA NA USM\n\nPROCESSO: SAP 133372/2025 + SAP 146875/2025\n\nOBJETO E FUNDAMENTAÇÃO:\n\nO Grupo Colegiado apresenta à deliberação a permanência ou exclusão\ndo interno RUAN LIRA RODRIGUES - 874404, na Unidade de\nSegurança Máxima do Estado, considerando que a decisão judicial de\ninclusão em Regime Disciplinar Diferenciado (RDD) foi proferida pelo\nprazo de 06 meses ou até o recambiamento definitivo ao Estado do\nPará, o que ocorrer primeiro. Ocorre que, no caso concreto, o\nrecambiamento definitivo não se efetivou, razão pela qual se faz\nnecessária a presente deliberação acerca de sua permanência na\nUnidade de Segurança Máxima do Estado.\n\nInicialmente, destaca-se que todos os integrantes da Comissão\nconcordam que permanecem hígidos os fundamentos que ensejaram a\ninclusão do interno em estabelecimento penal de maior rigor,\nconsiderando sua submissão ao Regime Disciplinar Diferenciado, sua\nvinculação a organização criminosa, o elevado risco à ordem e à\ndisciplina prisionais e a necessidade de manutenção em ambiente de\nsegurança reforçada. A medida encontra amparo no Anexo Único da\nPortaria 1465/GABS/SAP/2023, especialmente no art. 2º, incisos III, IV e\nVI, bem como no art. 52 da Lei de Execução Penal.\n\nEmbora a Súmula 662 do Superior Tribunal de Justiça se refira, em sua\nliteralidade, ao sistema penitenciário federal, o entendimento nela\nconsolidado pode ser aplicado, por analogia, às deliberações de\npermanência em unidade de segurança máxima estadual. Isso porque a\nmanutenção da medida excepcional não depende, necessariamente, da\nocorrência de fato novo, desde que permaneçam atuais e concretamente\ndemonstrados os fundamentos que justificaram a inclusão inicial do\ncustodiado. Nesse sentido, dispõe a Súmula n. 662 do STJ: “Para a\nprorrogação do prazo de permanência no sistema penitenciário federal, é\nprescindível a ocorrência de fato novo; basta constar, em decisão\nfundamentada, a persistência dos motivos que ensejaram a transferência\ninicial do preso” (Terceira Seção, julgado em 13/9/2023, DJe 18/9/2023).\n\nNo caso em análise, RUAN LIRA RODRIGUES apresenta perfil de\nelevada periculosidade, evidenciado pelo contexto fático que motivou\nsua inclusão na Unidade de Segurança Máxima. Conforme constou da\ndecisão judicial e do requerimento formulado pela administração prisional\nlocal, o interno foi preso em Brusque, em 31 de outubro de 2025, quase\nque concomitantemente à prisão de seu comparsa, Alessandro Magno\nDias, capturado em Florianópolis. As prisões ocorreram em cumprimento\na mandados de prisão expedidos pelo Tribunal de Justiça do Estado do\nPará, no âmbito da operação Coalizão pela Paz, chefiada pela Força\nIntegrada de Combate ao Crime Organizado do Pará – FICCO/PA e pelo\nGrupo de Trabalho de Facções Criminosas – GTF (NIP).\n\nPág. 01 de 03 - Documento assinado digitalmente. Para conferência, acesse o site https://portal.sgpe.sea.sc.gov.br/portal-externo e informe o processo SAP 00133372/2025 e o código FOM81N52.\n\n21\n\nESTADO DE SANTA CATARINA\n\nSECRETARIA DE ESTADO DE JUSTIÇA E REINTEGRAÇÃO SOCIAL\n\nDEPARTAMENTO DE POLÍCIA PENAL\n\nGRUPO COLEGIADO – INCLUSÃO/EXCLUSÃO NA UNIDADE DE SEGURANÇA MÁXIMA\n\nSecretaria de Estado de Justiça e Reintegração Social\n\nRua Fúlvio Aducci, n.º 1214 – Bairro Estreito – CEP 88075-000 – Florianópolis/SC\n\npoliciapenal@pp.sc.gov.br\n\nO objetivo da operação era dar cumprimento a mandados de prisão\npreventiva expedidos após representação da FICCO/PA junto à Vara de\nCombate ao Crime Organizado de Belém e recurso interposto pelo\nGrupo de Atuação Especial no Combate ao Crime Organizado do\nMinistério Público do Pará – GAECO perante o Tribunal de Justiça do\nEstado do Pará. Em Santa Catarina, a operação contou com a\ncolaboração da Polícia Civil de Santa Catarina, por meio da Divisão de\nInvestigações Criminais de Brusque e da Coordenadoria de Operações\nEspeciais – CORE/SC. As diligências resultaram na prisão de pessoas\nidentificadas como integrantes de organização criminosa especializada\nno tráfico ilícito de entorpecentes, extorsões e atentados contra a vida de\nagentes da segurança pública.\n\nDe acordo com o inquérito policial que subsidiou as medidas cumpridas,\nos investigados integrantes do Comando Vermelho exerciam a função de\nidealizadores de missões, sendo responsáveis pelo planejamento e\nexecução de ações violentas perpetradas pelo grupo, tais como dano ao\npatrimônio, incêndios a veículos, roubos, homicídios e ataques contra\nagentes da segurança pública. Tais circunstâncias revelam não apenas a\ngravidade concreta dos fatos atribuídos ao custodiado, mas também sua\ninserção qualificada em organização criminosa de elevada\npericulosidade.\n\nO histórico criminal de RUAN demonstra elevado risco à segurança, à\ndisciplina e à ordem do ambiente prisional comum, mostrando-se\nimprescindível sua permanência em estabelecimento prisional dotado de\nestrutura de segurança reforçada e regime de isolamento compatível\ncom o grau de sua periculosidade, de modo a viabilizar maior controle e\nmonitoramento de suas comunicações e eventuais articulações com o\nmeio externo e com outros membros da facção criminosa.\n\nDiante desse quadro, o retorno do custodiado a unidade prisional comum\nrepresentaria risco concreto à segurança, à disciplina e à ordem do\nsistema prisional catarinense, considerada sua vinculação a organização\ncriminosa, sua capacidade de articulação e a gravidade das condutas a\nele atribuídas. Mostra-se, assim, necessária sua manutenção em\nestabelecimento prisional dotado de segurança reforçada e regime\ncompatível com seu grau de periculosidade, a fim de assegurar maior\ncontrole sobre suas comunicações e impedir novas articulações ilícitas\ncom o meio externo e com outros integrantes da facção criminosa.\n\nSendo assim, este Grupo Colegiado entende por sua manutenção em\nunidade prisional com maior monitoramento e segurança (Unidade de\nSegurança Máxima), considerando tratar-se de apenado incompatível\ncom a massa carcerária comum dos estabelecimentos penais do Estado\nde Santa Catarina, pugnando por sua PERMANÊNCIA em ala de\nsegurança máxima, com fulcro no Anexo Único da Portaria\n1465/GABS/SAP/2023, art. 2º, incisos III, IV e VI, bem como no art. 52\nda Lei de Execução Penal e, por analogia, na Súmula 662 do STJ,\nobjetivando-se, acima de tudo, neutralizar a articulação de novos crimes\ne resguardar a ordem, a disciplina e a segurança do sistema prisional\ncatarinense, razão pela qual solicita RATIFICAÇÃO da decisão\nadministrativa pelo juízo competente.\n\nPág. 02 de 03 - Documento assinado digitalmente. Para conferência, acesse o site https://portal.sgpe.sea.sc.gov.br/portal-externo e informe o processo SAP 00133372/2025 e o código FOM81N52.\n\n22\n\nESTADO DE SANTA CATARINA\n\nSECRETARIA DE ESTADO DE JUSTIÇA E REINTEGRAÇÃO SOCIAL\n\nDEPARTAMENTO DE POLÍCIA PENAL\n\nGRUPO COLEGIADO – INCLUSÃO/EXCLUSÃO NA UNIDADE DE SEGURANÇA MÁXIMA\n\nSecretaria de Estado de Justiça e Reintegração Social\n\nRua Fúlvio Aducci, n.º 1214 – Bairro Estreito – CEP 88075-000 – Florianópolis/SC\n\npoliciapenal@pp.sc.gov.br\n\nNada mais a ser deliberado, foi encerrada a presente sessão e lavrada a\nAta, de número 034, que vai assinada pelos membros do Grupo\nColegiado.\n\nCATEGORIA: Permanência de preso em Unidade Prisional de Segurança Máxima do\nEstado.\n\nDELIBERAÇÃO:\n\nDEFERIDO INDEFERIDO\n\nOBS: O Grupo Colegiado da Secretaria de Estado da Administração Prisional e Socioeducativa analisa a\ntransferência segundo a PORTARIA 1465/GABS/SAP/2023, anexo único. Analisa requisitos inerentes à\nsegurança dos estabelecimentos prisionais. As disposições constantes no anexo único, serão interpretadas\nem consonância com a Lei Federal nº 11.671, de 8 de maio de 2008 e Decreto Federal nº 6.877, de 18 de\njunho de 2009\n\nDiretor de Inteligência e Informação da\nSEJURI\n\nDiretor-Geral do Departamento de Polícia\nPenal\n\nCoordenadora de Controle de Vagas DPP\n\nCoordenadora de Execuções Penais DPP\n\nx\n\nPág. 03 de 03 - Documento assinado digitalmente. Para conferência, acesse o site https://portal.sgpe.sea.sc.gov.br/portal-externo e informe o processo SAP 00133372/2025 e o código FOM81N52.\n\n23\n\nAssinaturas do documento\n\nCódigo para verificação: FOM81N52\n\nEste documento foi assinado digitalmente pelos seguintes signatários nas datas indicadas:\n\nLEILA KARENINA FERREIRA FARIAS (CPF: 041.XXX.989-XX) em 04/05/2026 às 14:47:12\n\nEmitido por: \"SGP-e\", emitido em 13/07/2018 - 14:17:22 e válido até 13/07/2118 - 14:17:22.\n(Assinatura do sistema)\n\nJÉSSICA KARLA VEIGA (CPF: 078.XXX.459-XX) em 04/05/2026 às 15:39:58\n\nEmitido por: \"SGP-e\", emitido em 26/04/2019 - 18:48:55 e válido até 26/04/2119 - 18:48:55.\n(Assinatura do sistema)\n\nMARCELO FLORES FORBICI (CPF: 046.XXX.439-XX) em 04/05/2026 às 16:39:07\n\nEmitido por: \"SGP-e\", emitido em 21/05/2019 - 19:18:15 e válido até 21/05/2119 - 19:18:15.\n(Assinatura do sistema)\n\nMA cial no Combate ao Crime\nOrganizado do Ministério Público do Pará – GAECO perante o Tribunal de Justiça do Estado do Pará.\nEm Santa Catarina, a operação contou com a colaboração da Polícia Civil de Santa Catarina, por\nmeio da Divisão de Investigações Criminais de Brusque e da Coordenadoria de Operações Especiais\n– CORE/SC. As diligências resultaram na prisão de pessoas identificadas como integrantes de\norganização criminosa especializada no tráfico ilícito de entorpecentes, extorsões e atentados contra\na vida de agentes da segurança pública. De acordo com o inquérito policial que subsidiou as medidas\ncumpridas, os investigados integrantes do Comando Vermelho exerciam a função de idealizadores de\nmissões, sendo responsáveis pelo planejamento e execução de ações violentas perpetradas pelo\ngrupo, tais como dano ao patrimônio, incêndios a veículos, roubos, homicídios e ataques contra\nagentes da segurança pública. Tais circunstâncias revelam não apenas a gravidade concreta dos\nfatos atribuídos ao custodiado, mas também sua inserção qualificada em organização criminosa de\nelevada periculosidade. O histórico criminal de RUAN demonstra elevado risco à segurança, à\ndisciplina e à ordem do ambiente prisional comum, mostrando-se imprescindível sua permanência em\nestabelecimento prisional dotado de estrutura de segurança reforçada e regime de isolamento\ncompatível com o grau de sua periculosidade, de modo a viabilizar maior controle e monitoramento de\nsuas comunicações e eventuais articulações com o meio externo e com outros membros da facção\ncriminosa. Diante desse quadro, o retorno do custodiado a unidade prisional comum representaria\nrisco concreto à segurança, à disciplina e à ordem do sistema prisional catarinense, considerada sua\nvinculação a organização criminosa, sua capacidade de articulação e a gravidade das condutas a ele\natribuídas. Mostra-se, assim, necessária sua manutenção em estabelecimento prisional dotado de\nsegurança reforçada e regime compatível com seu grau de periculosidade, a fim de assegurar maior\ncontrole sobre suas comunicações e impedir novas articulações ilícitas com o meio externo e com\noutros integrantes da facção criminosa. Sendo assim, este Grupo Colegiado entende por sua\n\nPág. 01 de 02 - Documento assinado digitalmente. Para conferência, acesse o site https://portal.sgpe.sea.sc.gov.br/portal-externo e informe o processo SAP 00133372/2025 e o código 1RI7E2K7.\n\n19\n\nESTADO DE SANTA CATARINA\n\nSECRETARIA DE ESTADO DE JUSTIÇA E REINTEGRAÇÃO SOCIAL\n\nGRUPO COLEGIADO – INCLUSÃO NA UNIDADE DE SEGURANÇA MÁXIMA\n\nSecretaria de Estado de Justiça e Reintegração Social\n\nRua Fúlvio Aducci, n.º 1214 – Bairro Estreito – CEP 88075-000 – Florianópolis/SC\n\nmanutenção em unidade prisional com maior monitoramento e segurança (Unidade de Segurança\nMáxima), considerando tratar-se de apenado incompatível com a massa carcerária comum dos\nestabelecimentos penais do Estado de Santa Catarina, pugnando por sua PERMANÊNCIA em ala de\nsegurança máxima, com fulcro no Anexo Único da Portaria 1465/GABS/SAP/2023, art. 2º, incisos III,\nIV e VI, bem como no art. 52 da Lei de Execução Penal e, por analogia, na Súmula 662 do STJ,\nobjetivando-se, acima de tudo, neutralizar a articulação de novos crimes e resguardar a ordem, a\ndisciplina e a segurança do sistema prisional catarinense, razão pela qual solicita RATIFICAÇÃO da\ndecisão administrativa pelo juízo competente. Nada mais a ser deliberado, foi encerrada a presente\nsessão e lavrada a Ata, de número 034, que vai assinada pelos membros do Grupo Colegiado.\n\nDiretor de Inteligência e Informação da SEJURI\n\nDiretor-Geral do Departamento de Polícia Penal (DPP)\n\nCoordenadora de Controle de Vagas DPP\n\nCoordenadora de Execuções Penais DPP\n\nPág. 02 de 02 - Documento assinado digitalmente. Para conferência, acesse o site https://portal.sgpe.sea.sc.gov.br/portal-externo e informe o processo SAP 00133372/2025 e o código 1RI7E2K7.\n\n20\n\nAssinaturas d 404, na Unidade de Segurança Máxima do\nEstado, considerando decisão judicial de inclusão em Regime Disciplinar\nDiferenciado (RDD), pelo prazo de 06 meses ou até o recambiamento\ndefinitivo ao Estado do Pará, o que ocorrer primeiro.\n\nA decisão judicial teve origem em requerimento formulado pela\nAdministração Prisional local (Presídio Regional de Brusque), conforme\nse extrai do Ofício nº. 0411/2025/PR17/DPP (SGPE SAP 146875/2025),\ndestacando a direção que trata-se de indivíduo de alta periculosidade, e\npossuidor de posição de liderança na organização criminosa Comando\nVermelho no Estado de Santa Catarina.\n\nNo dia 31 de outubro de 2025, o recluso Ruan Lira foi preso em\nBrusque, quase que concomitantemente à prisão de seu comparsa,\nAlessandro Magno Dias, que foi preso na capital Florianópolis.\n\nAs prisões ocorreram em cumprimento a mandados de prisão autos\n0821482-33.2025.8.14.0000 expedidos pelo TJPA no âmbito da\noperação Coalizão pela Paz, chefiada pela Força Integrada de Combate\nao Crime Organizado do Pará FICCO/PA e o Grupo de Trabalho de\nFacções Criminosas GTF (NIP).\n\nO objetivo da operação era dar cumprimento à mandados de prisão\npreventiva expedidos pelo desembargador JORGE LUIZ LISBOA\nSANCHES, após representação da FICCO/PA junto à Vara de Combate\nao Crime Organizado de Belém e recurso interposto pelo Grupo de\nAtuação Especial no Combate ao Crime Organizado do Ministério\nPúblico do Pará - GAECO perante o Tribunal de Justiça do Estado do\nPará, em Santa Catarina a operação contou com colaboração da Polícia\nCivil de Santa Catarina, através da Divisão de Investigações Criminais\nde Brusque e da Coordenadoria de Operações Especiais CORE/SC.\n\nAs diligências resultaram na prisão de 9 pessoas, 2 em Santa Catarina,\nidentificadas como integrantes de uma organização criminosa\nespecializada no tráfico ilícito de entorpecentes, extorsões e atentados\ncontra a vida de agentes da segurança pública.\n\nDe acordo com o inquérito policial que subsidiou as medidas\ncumpridas hoje, os investigados integrantes do Comando\nVermelho exercem a função de IDEALIZADORES DE MISSÕES,\nresponsável pelo planejamento e execução das ações violentas\nperpetradas pelo grupo, tais como dano ao patrimônio, incêndios a\nveículos, roubos, homicídios e ataques contra agentes da\nsegurança pública.\n\nPág. 01 de 02 - Documento assinado digitalmente. Para conferência, acesse o site https://portal.sgpe.sea.sc.gov.br/portal-externo e informe o processo SAP 00133372/2025 e o código 8LQP172X.\n\n10\n\nESTADO DE SANTA CATARINA\n\nSECRETARIA DE ESTADO DE JUSTIÇA E REINTEGRAÇÃO SOCIAL\n\nDEPARTAMENTO DE POLÍCIA PENAL\n\nGRUPO COLEGIADO – INCLUSÃO/EXCLUSÃO NA UNIDADE DE SEGURANÇA MÁXIMA\n\nSecretaria de Estado de Justiça e Reintegração Social\n\nRua Fúlvio Aducci, n.º 1214 – Bairro Estreito – CEP 88075-000 – Florianópolis/SC\n\npoliciapenal@pp.sc.gov.br\n\nO histórico criminal de RUAN demonstra o elevado risco à segurança,\ndisciplina e ordem do ambiente prisional comum, mostrando-se\nimprescindível a sua permanência em estabelecimento prisional dotado\nde estrutura de segurança reforçada e regime de isolamento compatível\ncom o grau de sua periculosidade, de modo a viabilizar maior controle e\nmonitoramento de suas comunicações e eventuais articulações com o\nmeio externo e com outros membros da facção criminosa.\n\nComo adverte Cezar Roberto Bitencourt (2022), em sua obra Tratado de\nDireito Penal, a disciplina prisional constitui elemento indispensável à\nexecução penal, sendo que sua ruptura, quando associada a\norganizações criminosas, “alimenta a engrenagem do crime organizado,\nque encontra no cárcere terreno fértil para seu fortalecimento”.\n\nÉ importante destacar, ainda, que o crime organizado constitui uma\ndas maiores ameaças contemporâneas ao Estado Democrático de\nDireito, sobretudo no ambiente prisional, onde desafiam a\nlegitimidade do poder estatal, impondo regras próprias e corroendo a\nsoberania jurídica. O fomento ao crime organizado dentro dos\nestabelecimentos penais jamais será tolerado em Santa Catarina, sob\npena de se consolidar uma estrutura paralela de poder que deslegitima o\npróprio Estado.\n\nSendo assim, este o Grupo Colegiado entende por sua imediata inclusão\nem unidade prisional com maior monitoramento e segurança (Unidade\nde Segurança Máxima), considerando não apenas a decisão judicial a\nser cumprida, mas também por se tratar de um apenado diferenciado da\ngrande massa carcerária dos estabelecimentos penais comuns do\nEstado de Santa Catarina, pugnando por sua imediata INCLUSÃO, com\nfulcro no Anexo Único, da Portaria 1465/GABS/SAP/2023, artigo 2º\n\nincisos III, IV e VI – estar submetido ao Regime Disciplinar Diferenciado\n(RDD), for integrante de organização criminosa; estiver envolvido em\nepisódios de violência de grande repercussão social ou grave indisciplina\nno sistema prisional de origem, cumprindo-se, assim, os requisitos\nexigidos também no artigo 52, da Lei de Execução Penal, objetivando-\nse, acima de tudo, neutralizar a articulação de novos crimes, pondo\nem risco à segurança pública do Estado de Santa Catarina.\n\nNada mais a ser deliberado, foi encerrada a presente sessão e lavrada a\nAta, de número 070, que vai assinada pelos membros do Grupo\nColegiado.\n\nCATEGORIA: Inclusão de preso em Unidade Prisional de Segurança Máxima do Estado.\n\nDELIBERAÇÃO:\n\nDEFERIDO INDEFERIDO\n\nOBS: O Grupo Colegiado da Secretaria de Estado da Administração Prisional e Socioeducativa analisa a\ntransferência segundo a PORTARIA 1465/GABS/SAP/2023, anexo único. Analisa requisitos inerentes à\nsegurança dos estabelecimentos prisionais. As disposições constantes no anexo único, serão interpretadas\nem consonância com a Lei Federal nº 11.671, de 8 de maio de 2008 e Decreto Federal nº 6.877, de 18 de\njunho de 2009\n\nDiretor de Inteligência e Informação da\nSEJURI\n\nDiretor-Geral do Departamento de Polícia\nPenal\n\nCoordenadora de Controle de Vagas DPP\ne.e.\nCoorden cumpridas hoje,\nos investigados integrantes do Comando Vermelho exercem a função de\nIDEALIZADORES DE MISSÕES, responsável pelo planejamento e execução das\nações violentas perpetradas pelo grupo, tais como dano ao patrimônio, incêndios a\nveículos, roubos, homicídios e ataques contra agentes da segurança pública.\n\nO histórico criminal de RUAN demonstra o elevado risco à segurança, disciplina e\nordem do ambiente prisional comum, mostrando-se imprescindível a sua\npermanência em estabelecimento prisional dotado de estrutura de segurança\nreforçada e regime de isolamento compatível com o grau de sua periculosidade, de\nmodo a viabilizar maior controle e monitoramento de suas comunicações e eventuais\narticulações com o meio externo e com outros membros da facção criminosa.\n\nPág. 01 de 02 - Documento assinado digitalmente. Para conferência, acesse o site https://portal.sgpe.sea.sc.gov.br/portal-externo e informe o processo SAP 00133372/2025 e o código N4W1RT62.\n\n12\n\nESTADO DE SANTA CATARINA\n\nSECRETARIA DE ESTADO DE JUSTIÇA E REINTEGRAÇÃO SOCIAL\n\nGRUPO COLEGIADO – INCLUSÃO NA UNIDADE DE SEGURANÇA MÁXIMA\n\nSecretaria de Estado de Justiça e Reintegração Social\n\nRua Fúlvio Aducci, n.º 1214 – Bairro Estreito – CEP 88075-000 – Florianópolis/SC\n\nComo adverte Cezar Roberto Bitencourt (2022), em sua obra Tratado de Direito\nPenal, a disciplina prisional constitui elemento indispensável à execução penal,\nsendo que sua ruptura, quando associada a organizações criminosas, “alimenta a\nengrenagem do crime organizado, que encontra no cárcere terreno fértil para seu\nfortalecimento”.\n\nÉ importante destacar, ainda, que o crime organizado constitui uma das maiores\nameaças contemporâneas ao Estado Democrático de Direito, sobretudo no ambiente\nprisional, onde desafiam a legitimidade do poder estatal, impondo regras próprias e\ncorroendo a soberania jurídica. O fomento ao crime organizado dentro dos\nestabelecimentos penais jamais será tolerado em Santa Catarina, sob pena de se\nconsolidar uma estrutura paralela de poder que deslegitima o próprio Estado.\n\nSendo assim, este o Grupo Colegiado entende por sua imediata inclusão em unidade\nprisional com maior monitoramento e segurança (Unidade de Segurança Máxima),\nconsiderando não apenas a decisão judicial a ser cumprida, mas também por se\ntratar de um apenado diferenciado da grande massa carcerária dos estabelecimentos\npenais comuns do Estado de Santa Catarina, pugnando por sua imediata\nINCLUSÃO, com fulcro no Anexo Único, da Portaria 1465/GABS/SAP/2023, artigo 2º\nincisos III, IV e VI – estar submetido ao Regime Disciplinar Diferenciado (RDD), for\nintegrante de organização criminosa; estiver envolvido em episódios de violência de\ngrande repercussão social ou grave indisciplina no sistema prisional de origem,\ncumprindo-se, assim, os requisitos exigidos também no artigo 52, da Lei de\nExecução Penal, objetivando-se, acima de tudo, neutralizar a articulação de novos\ncrimes, pondo em risco à segurança pública do Estado de Santa Catarina.\n\nNada mais a ser deliberado, foi encerrada a presente sessão e lavrada a Ata, de\nnúmero 070, que vai assinada pelos membros do Grupo Colegiado.\n\nDiretor de Inteligência e Informação da SEJURI\n\nDiretor-Geral do Departamento de Polícia Penal (DPP)\n\nCoordenadora de Controle de Vagas DPP e.e.\n\nCoordenadora de Execuções Penais DPP\n\nPág. 02 de 02 - Documento assinado digitalmente. Para conferência, acesse o site https://portal.sgpe.sea.sc.gov.br/portal-externo e informe o processo SAP 00133372/2025 e o código N4W1RT62.\n\n13\n\nAssinaturas do documento\n\nCódigo para verificação: N4W1RT62\n\nEste documento foi assinado digitalmente pelos seguintes signatários nas datas indicadas:\n\nBRUNA ROBERTA WESSNER LONGEN (CPF: 050.XXX.569-XX) em 15/12/2025 às 19:16:34\n\nEmitido por: \"SGP-e\", emitido em 16/05/2019 - 17:46:26 e válido até 16/05/2119 - 17:46:26.\n(Assinatura do sistema)\n\nMAICON RONALD ALVES (CPF: 023.XXX.049-XX) em 15/12/2025 às 19:22:46\n\nEmitido por: \"SGP-e\", emitido em 16/05/2019 - 17:39:45 e válido até 16/05/2119 - 17:39:45.\n(Assinatura do sistema)\n\nMARCELO FLORES FORBICI (CPF: 046.XXX.439-XX) em 16/12/2025 às 14:43:54\n\nEmitido por: \"SGP-e\", emitido em 21/05/2019 - 19:18:15 e válido até 21/05/2119 - 19:18:15.\n(Assinatura do sistema)\n\nPara verificar a autenticidade desta cópia, acesse o link https://portal.sgpe.sea.sc.gov.br/portal-externo/conferencia-\ndocumento/U0FQXzIwMTQwXzAwMTMzMzcyXzEzMzkxNV8yMDI1X040VzFSVDYy ou o site\nhttps://portal.sgpe.sea.sc.gov.br/portal-externo e informe o processo SAP 00133372/2025 e o código N4W1RT62\n\nou aponte a câmera para o QR Code presente nesta página para realizar a conferência."}]},"emRes":{"874404":"HISTÓRICO ADICIONAL:\nEm 31/10/2025, RUAN LIRA RODRIGUES, IPEN 874404, foi preso no Município de Brusque/SC. A prisão ocorreu quase concomitantemente à de Alessandro Magno Dias, efetuada em Florianópolis/SC. Ambas cumpriram mandados de prisão preventiva expedidos pelo Tribunal de Justiça do Estado do Pará nos autos n.º 0821482-33.2025.8.14.0000, pelo Desembargador Jorge Luiz Lisboa Sanches, no âmbito da operação Coalizão pela Paz. A operação foi chefiada pela Força Integrada de Combate ao Crime Organizado do Pará (FICCO/PA) e pelo Grupo de Trabalho de Facções Criminosas (GTF/NIP). Os mandados decorreram de representação da FICCO/PA perante a Vara de Combate ao Crime Organizado de Belém e de recurso interposto pelo Grupo de Atuação Especial no Combate ao Crime Organizado do Ministério Público do Pará (GAECO) perante o Tribunal de Justiça do Estado do Pará. Em Santa Catarina, a operação contou com a colaboração da Polícia Civil, por meio da Divisão de Investigações Criminais de Brusque e da Coordenadoria de Operações Especiais (CORE/SC). Conforme a Ata n.º 070/2025, as diligências resultaram na prisão de nove pessoas, duas delas em Santa Catarina, identificadas como integrantes de organização criminosa especializada no tráfico ilícito de entorpecentes, em extorsões e em atentados contra a vida de agentes da segurança pública.\n\nNa sequência, a direção do Presídio Regional de Brusque, unidade de origem, formulou requerimento à autoridade judicial por meio do Ofício n.º 0411/2025/PR17/DPP (SGPE SAP 146875/2025). Esse requerimento deu origem à decisão judicial, datada de 04/11/2025, proferida pelo Juiz de Direito Edemar Leopoldo Schlösser, Corregedor do Presídio Regional de Brusque, que autorizou a transferência do custodiado para a Unidade de Segurança Máxima (USM). A decisão não está acostada a procedimento específico e consta apenas no SGPE. As Atas n.º 070/2025 e n.º 034/2026 referem-se a decisão judicial de inclusão em Regime Disciplinar Diferenciado (RDD), \"pelo prazo de 06 meses ou até o recambiamento definitivo ao Estado do Pará, o que ocorrer primeiro\". Segundo os dados cadastrais, o ingresso na Unidade de Segurança Máxima ocorreu em 01/11/2025.\n\nEm 15/12/2025, o Grupo Colegiado apreciou a inclusão do custodiado na Unidade de Segurança Máxima, conforme Ata e Deliberação n.º 070/2025. Em 04/05/2026, apreciou sua permanência, conforme Ata e Deliberação n.º 034/2026, e consignou que o recambiamento definitivo ao Estado do Pará não havia se efetivado. Os documentos analisados não registram fatos posteriores à Ata n.º 034/2026, de 04/05/2026. Permanece sem efetivação o recambiamento ao Estado do Pará. Não há informação nos documentos sobre a conduta carcerária do custodiado na Unidade de Segurança Máxima.\n\nELEMENTOS PROBATÓRIOS:\nOfício n.º 0411/2025/PR17/DPP (SGPE SAP 146875/2025), da direção do Presídio Regional de Brusque, data [NÃO CONSTA NOS DOCUMENTOS]. Conforme a Ata n.º 070/2025, de 15/12/2025, o ofício qualifica o custodiado como \"indivíduo de alta periculosidade, e possuidor de posição de liderança na organização criminosa Comando Vermelho no Estado de Santa Catarina\".\n\nMandados de prisão preventiva expedidos pelo Tribunal de Justiça do Estado do Pará nos autos n.º 0821482-33.2025.8.14.0000, data de expedição [NÃO CONSTA NOS DOCUMENTOS], cumpridos em 31/10/2025 no âmbito da operação Coalizão pela Paz (conforme Ata n.º 070/2025 e Ata n.º 034/2026).\n\nInquérito policial que subsidiou as medidas cumpridas na operação, número e autoridade responsável [NÃO CONSTA NOS DOCUMENTOS]. Segundo a Ata n.º 070/2025, o inquérito registra que \"os investigados integrantes do Comando Vermelho exercem a função de IDEALIZADORES DE MISSÕES, responsável pelo planejamento e execução das ações violentas perpetradas pelo grupo, tais como dano ao patrimônio, incêndios a veículos, roubos, homicídios e ataques contra agentes da segurança pública\".\n\nDecisão judicial de inclusão em Regime Disciplinar Diferenciado, proferida a partir do requerimento da unidade de origem, pelo prazo de seis meses ou até o recambiamento definitivo ao Estado do Pará. Juízo, número dos autos e data: [NÃO CONSTA NOS DOCUMENTOS].\n\nAta e Deliberação n.º 070/2025, de 15/12/2025 (inclusão), e Ata e Deliberação n.º 034/2026, de 04/05/2026 (permanência), lavradas pelo Grupo Colegiado nos autos do processo SAP 00133372/2025. A Ata n.º 034/2026 registra a não efetivação do recambiamento definitivo até aquela data.\n\nRegistros disciplinares, relatórios de inteligência e certidão de conduta carcerária relativos à permanência na Unidade de Segurança Máxima: [NÃO CONSTA NOS DOCUMENTOS].\n\nFUNDAMENTAÇÃO E ANÁLISE DE RISCO INSTITUCIONAL:\nA análise da subsistência dos motivos que ensejaram a inclusão de RUAN LIRA RODRIGUES na Unidade de Segurança Máxima ancora-se no art. 2º, inciso I, do Anexo Único da Portaria n.º 1465/GABS/SAP/2023, que contempla o custodiado que tenha desempenhado função de liderança ou participado de forma relevante em organização criminosa. Esse enquadramento encontra respaldo em dois elementos documentais. O primeiro é a informação prestada pela direção do Presídio Regional de Brusque no Ofício n.º 0411/2025/PR17/DPP, que atribui ao custodiado posição de liderança na organização criminosa Comando Vermelho no Estado de Santa Catarina. O segundo é o conteúdo do inquérito policial que fundamentou os mandados de prisão preventiva dos autos n.º 0821482-33.2025.8.14.0000, segundo o qual os investigados integrantes daquela facção exerciam a função de idealizadores de missões, com atribuição de planejamento e execução de ações violentas, inclusive homicídios e ataques contra agentes da segurança pública. A conjugação desses elementos, aliada ao fato de o custodiado ter sido alvo de operação interestadual de combate ao crime organizado conduzida pela FICCO/PA, sustenta documentalmente a relevância de sua inserção na estrutura da organização criminosa.\n\nOs motivos que fundamentaram a inclusão têm natureza estrutural, pois decorrem da posição atribuída ao custodiado na organização criminosa, e não de episódio isolado e transitório. Os documentos analisados não registram desvinculação da facção, revogação da custódia cautelar decretada pelo Tribunal de Justiça do Estado do Pará ou efetivação do recambiamento definitivo, cuja ausência foi expressamente consignada na Ata n.º 034/2026. Nesse quadro documental, os pressupostos fáticos que ensejaram a inclusão permanecem os mesmos.\n\nQuanto à realidade da Unidade de Segurança Máxima, registra-se como premissa institucional que eventual comportamento formalmente disciplinado do custodiado na unidade especializada reflete, em larga medida, o próprio regime de contenção a que está submetido. Esse comportamento não elide, por si só, a periculosidade decorrente da posição ocupada na organização criminosa. Os documentos analisados não contêm registro disciplinar, positivo ou negativo, relativo ao período de permanência na unidade.\n\nTambém como premissa institucional, consigna-se a imprescindibilidade de alocação em arquitetura de isolamento e baixa lotação, com celas individuais ou duplas, padrão exclusivo da Unidade de Segurança Máxima no sistema prisional catarinense. A ausência dessa arquitetura comprometeria a ordem do sistema ordinário. No caso, essa necessidade vincula-se à preocupação, já registrada pelo Grupo Colegiado nas Atas n.º 070/2025 e n.º 034/2026, com o controle e o monitoramento das comunicações do custodiado e de suas eventuais articulações com o meio externo e com outros integrantes da facção. A alocação coletiva própria das unidades ordinárias ampliaria a possibilidade de contato com a massa carcerária e com membros da mesma organização criminosa, o que contraria a finalidade de neutralizar a articulação de novas práticas delitivas.\n\nPONTOS A VERIFICAR PELO ANALISTA:\nDivergência de numeração e data na Deliberação n.º 034. O cabeçalho registra \"DELIBERAÇÃO nº 034/2025 Florianópolis, 04 de maio de 2025\", ao passo que os DADOS DO CASO, a Ata correspondente (\"ATA N.º 0034.2026/GABS\") e as assinaturas digitais (04/05/2026) indicam 2026. O próprio documento narra fatos de 31/10/2025, o que é incompatível com a data de maio de 2025. Correção sugerida: Deliberação n.º 034/2026, de 04/05/2026.\n\nGrafia do número do processo. Os documentos registram \"SAP 133372/2025 + SAP 146875/2025\" no campo PROCESSO e \"SAP 00133372/2025\" no rodapé de autenticação. Correção sugerida: padronizar como SAP 00133372/2025, conforme os DADOS DO CASO, e confirmar a numeração completa do processo SAP 146875/2025, apensado ou vinculado.\n\nDivergência de incisos. As Atas e Deliberações n.º 070/2025 e n.º 034/2026 fundamentaram a medida no art. 2º, incisos III, IV e VI, além do art. 52 da Lei de Execução Penal. Os DADOS DO CASO indicam exclusivamente o inciso I, que não foi citado em nenhum documento anterior. A minuta tratou apenas do inciso I. Cabe ao analista confirmar se a alteração é intencional, sobretudo porque o inciso III (submissão ao RDD) pode ter perdido o suporte fático com o decurso do prazo judicial.\n\nIndividualização da função de liderança. A posição de liderança é afirmada apenas pela direção da unidade de origem no Ofício n.º 0411/2025/PR17/DPP. A função de \"idealizadores de missões\" é atribuída, no inquérito, aos investigados de forma coletiva, sem individualização expressa da conduta do custodiado. Recomenda-se a juntada do ofício, do inquérito ou da decisão do TJPA para confirmar o papel específico atribuído a RUAN LIRA RODRIGUES.\n\nSituação do RDD e do recambiamento. A decisão judicial de inclusão em RDD tinha prazo de seis meses ou até o recambiamento definitivo, mas não constam o juízo prolator, o número dos autos nem a data da decisão. Não há informação sobre prorrogação, encerramento do RDD ou efetivação do recambiamento após 04/05/2026.\n\nJuízo competente e situação processual. A vara ou juízo da execução não consta nos documentos. Os documentos mencionam apenas o Tribunal de Justiça do Estado do Pará (autos n.º 0821482-33.2025.8.14.0000) e a Vara de Combate ao Crime Organizado de Belém, que não se confundem necessariamente com o juízo da execução ou com o juízo responsável pela ratificação. A pena também não consta. Os documentos anteriores tratam o custodiado como \"apenado\", mas a única custódia documentada é preventiva. Recomenda-se verificar se se trata de preso provisório ou condenado.\n\nData de ingresso na USM. A data de 01/11/2025 consta apenas dos dados cadastrais e não é registrada em nenhum documento analisado. A deliberação de inclusão é de 15/12/2025, posterior ao ingresso informado. Convém confirmar se o ingresso decorreu diretamente da decisão judicial de RDD, antes da deliberação do Colegiado, ou se há erro na data.\n\nPeríodo sem cobertura documental. Não há documentos referentes ao intervalo entre 04/05/2026 e a sessão de 19/10/2026, nem elementos sobre o 3º período de avaliação (02/11/2026 a 01/05/2027). Recomenda-se a juntada de relatório de inteligência atualizado, certidão carcerária e registros disciplinares da Unidade de Segurança Máxima. Sem esses documentos, a minuta não pode afirmar fato contemporâneo, favorável ou desfavorável ao custodiado.\n\nResultado das deliberações anteriores. No texto transcrito, o campo \"DEFERIDO INDEFERIDO\" das Deliberações n.º 070/2025 e n.º 034/2026 é seguido de um \"x\" isolado, sem indicação legível da opção assinalada. Convém confirmar o resultado nos originais.\n\nExpressão temporal imprecisa. A Ata e a Deliberação n.º 070/2025 reproduzem a expressão \"medidas cumpridas hoje\", aparentemente transcrita de nota de divulgação da operação. A expressão não foi reproduzida na minuta. A data de cumprimento documentada é 31/10/2025.\n\nDenominação do órgão. O cabeçalho dos documentos menciona a Secretaria de Estado de Justiça e Reintegração Social (SEJURI), enquanto a observação padrão das Deliberações menciona a \"Secretaria de Estado da Administração Prisional e Socioeducativa\". Convém verificar a denominação vigente a ser adotada.\n\nFormato de numeração das Atas. Os documentos alternam \"ATA N.º 0034.2026/GABS\" e \"Ata, de número 034\", bem como \"ATA N.º 0070.2025/GABS\" e \"Ata, de número 070\". Convém padronizar conforme o modelo do sistema.\n\nAssinaturas da Ata e da Deliberação n.º 070/2025. Constam três assinaturas digitais para quatro cargos indicados, com a anotação \"e.e.\" junto à Coordenadora de Controle de Vagas. Convém verificar a regularidade da composição do Colegiado naquela sessão.\n\nEnunciado sumular. As peças de 04/05/2026 invocaram, por analogia, enunciado sumular do STJ. Como os DADOS DO CASO indicam \"não citar\", esse fundamento não foi reproduzido na minuta.\n\nGrafia de nomes. Convém confirmar a grafia dos nomes de terceiros reproduzidos (Alessandro Magno Dias e Desembargador Jorge Luiz Lisboa Sanches) nos documentos originais da operação, já que os documentos ora analisados foram elaborados manualmente."},"emAns":{"874404":{}},"pre":[{"id":"pmvh0su91","nome":"ROBERTO DE SOUZA PAES JUNIOR","ipen":"896701","origem":"Presídio Regional de Imbituba","sgpe":"SEJURI 00118141/2026","ing":"","tipo":"InclusaoAla","motivo":"ALTA PERICULOSIDADE","criado":"2026-10-20","F":{"tipo":"InclusaoAla","num":"083/2026","data":"2026-10-20","sgpe":"SEJURI 00118141/2026","motivo":"ALTA PERICULOSIDADE","per":1,"ini":"","fim":"","inc":["I"],"s662":false,"reg":false,"hist":"A apreciação do pedido foi formalmente provocada pelo Presídio Regional de Imbituba, por meio do Ofício n.º 680/2026/SEJURI/PPSC/SR02/PR09/CPEN, datado de 17 de outubro de 2026, o qual veio acompanhado da manifestação do Juízo de Plantão exarada nos autos n.º 5003943-10.2026.8.24.0575, registrando a competência da administração prisional, via Coordenação de Vagas da SEJURI, para a deliberação da transferência entre unidades prisionais, nos moldes da Resolução Conjunta Interinstitucional n.º 01/2026. \nConsta do expediente que o custodiado foi capturado em 15/10/2026 no município de Imbituba/SC durante operação integrada entre a Polícia Civil do Amazonas (DENARC/PC-AM) e a Polícia Civil de Santa Catarina (DRD/DEIC/PCSC), em cumprimento a mandados de prisão preventiva expedidos pela Comarca de São Gabriel da Cachoeira/AM. Ante o risco imediato à segurança institucional apontado pela unidade prisional, o apenado foi removido emergencialmente para a Penitenciária Sul (Criciúma/SC) sob custódia temporária limitada ao prazo legal de 30 dias (art. 58 da LEP), aguardando a destinação definitiva em estabelecimento dotado de segurança reforçada.","elem":"Conforme detalhado no Ofício n.º 680/2026/SEJURI/PPSC/SR02/PR09/CPEN, a manifestação técnica e oficial da direção da unidade de origem registra os seguintes elementos de gravidade que fundamentam a medida excepcional:\n1. Liderança em Organização Criminosa Transnacional: O expediente oficial aponta que o custodiado exerce a principal liderança da organização criminosa autodenominada CARTEL 13, com pregressa vinculação à facção COMANDO VERMELHO, controlando rotas internacionais do narcotráfico na Amazônia (com conexões na Colômbia, Peru e Bolívia) e ramificações operacionais em diversos estados brasileiros, inclusive em Santa Catarina.\n2. Capacidade Financeira e Financiamento do Tráfico: O documento destaca a gravidade da imputação atinente ao art. 36 da Lei n.º 11.343/2006 (financiar ou custear a prática do narcotráfico), evidenciando elevado nível de articulação logística, financeira e estrutural capaz de comprometer a segurança de estabelecimentos penais comuns.\n3. Infiltração e Fraude em Sistemas Judiciais: O ofício relata fortes indícios de que o custodiado e/ou terceiros utilizavam senhas ilegais de acesso aos sistemas da Justiça Brasileira para inserir baixas indevidas em seus próprios mandados de prisão no sistema BNMP/CNJ, simulando o cumprimento de ordens judiciais, o que revela extrema audácia e alto risco de subversão institucional.\n4. Risco de Arrebatamento ou Continuidade Delitiva: A direção do estabelecimento prisional de origem alertou expressamente que a permanência em unidades de média segurança ou penitenciárias comuns expõe o sistema a vulnerabilidades extremas, com risco concreto de facilitação da continuidade delitiva ou tentativa de arrebatamento externo.","fund":"O Colegiado constatou que as unidades prisionais comuns de Santa Catarina, diante das restrições de contingente e da superlotação estrutural, revelam-se absolutamente inaptas para custodiar um alvo com o perfil delitivo e a capacidade de articulação descritos pela direção do Presídio Regional de Imbituba. Como adverte a doutrina especializada, a disciplina prisional constitui elemento indispensável à execução penal, sendo que sua ruptura, quando associada a organizações criminosas de caráter transnacional, alimenta a engrenagem do crime organizado, que encontra no cárcere terreno fértil para seu fortalecimento. É importante destacar, por oportuno, que o crime organizado constitui uma das maiores ameaças contemporâneas ao Estado Democrático de Direito, sobretudo no ambiente prisional, onde desafiam a legitimidade do poder estatal, impondo regras próprias e corroendo a soberania jurídica. O fomento ao crime organizado dentro dos estabelecimentos penais jamais será tolerado em Santa Catarina, sob pena de se consolidar uma estrutura paralela de poder que deslegitima o próprio Estado.\nNesse contexto, a alocação em arquitetura de segurança máxima, com rotinas severas de isolamento, controle absoluto de comunicações e monitoramento estrito — exclusivas da USM de São Cristóvão do Sul/SC —, constitui providência inafastável para neutralizar o risco institucional enquanto transita o pleito de recambiamento ao Estado de origem (SEJURI 119001/2026).","res":"","dec":"DEFERIDO"}}]}</script><script id="js">const CSS0=`

html,body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 Arial,Helvetica,sans-serif}
#app{max-width:1450px;margin:0 auto;padding:16px}
#hdr h1{font-size:15px;margin:0 0 2px}.mut{color:var(--mut);font-size:12px}
#hdr .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
#hdr .chip{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:3px 8px;font-size:11px}#hdr .chip b{font-size:13px;display:inline;margin-right:4px}
.tabbar{display:flex;gap:4px;border-bottom:2px solid var(--bd);margin:10px 0}
#hdr .tabbar{margin:4px 0}.tabbar button{font-size:12px;border:none;border-radius:0;background:transparent;padding:4px 10px;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabbar button.on{border-bottom:2px solid var(--ac);color:var(--ac);font-weight:bold}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:2px;padding-bottom:2px;box-shadow:0 4px 6px -6px #0006;font-size:12px}
#hdr input,#hdr select,#hdr button{font-size:12px;padding:4px 7px}
input,select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 9px}
button{cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.sm{padding:3px 7px;font-size:12px}
.wrap{overflow:auto;max-height:calc(100vh - 250px);background:var(--card);border:1px solid var(--bd);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:1250px}th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:11px;color:var(--mut);position:sticky;top:0;background:var(--card);z-index:4}
.ok{background:var(--ok)}.warn{background:var(--warn)}.bad{background:var(--bad)}.hot{background:var(--hot);font-weight:bold}
.flagged td{background:var(--flagbg)!important;border-left:3px solid var(--flagbd)}
.excl td{opacity:.5}
tr.detail td{background:var(--bg)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:10px}
.dgrid div b{display:block;font-size:10px;color:var(--mut);font-weight:normal}
.atas ul{margin:4px 0;padding-left:18px;font-size:12px}
.badge{display:inline-block;background:var(--card);border:1px solid var(--flagbd);border-radius:5px;padding:1px 6px;font-size:11px}
a.sgpe{color:var(--ac);text-decoration:none}a.sgpe:hover{text-decoration:underline}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);max-width:460px;width:92%}
dialog label{display:block;margin:8px 0 2px;font-size:12px;color:var(--mut)}dialog input:not([type=checkbox]){width:100%;box-sizing:border-box}
label.chk{display:flex;align-items:center;gap:6px;font-size:13px}label.chk input{width:auto}
details{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;margin:12px 0}
details input{width:100%;box-sizing:border-box;margin-top:4px}

<details><summary>Como o sistema calcula os ciclos (regras)</summary><p class="mut" style="margin-top:8px"><b>Avaliação semestral (todos os presos):</b> a cada 6 meses por data nominal, pelo calendário civil: o 1º período começa no ingresso e vence no dia de igual número seis meses depois; cada período seguinte começa no dia seguinte ao vencimento do anterior e vence seis meses depois do início nominal (ingresso em 01/11/2025 → 1º até 01/05/2026, 2º até 01/11/2026, 3º até 01/05/2027). O prazo é de meses, não de dias corridos: o nº de dias de cada período varia e não é critério. O vencimento cai no mesmo dia do mês do semestre seguinte, sem depender do nº de dias do mês (ingresso em 13/10 → vence 13/04 e depois 13/10; ingresso em 05/03 → vence 05/09). Se o dia não existir no mês de destino, vence no último dia do mês. Ciclos cumpridos = ciclos de 6 meses já findados na USM; um RDD concluído conta pelo equivalente em semestres (180 dias = 1; 360 ou 365 = 2; 730 = 4). Nos 30 dias anteriores ao fim do período vigente o sistema pede para assinalar o tipo de deliberação prevista. A cada vencimento o órgão colegiado delibera sobre a permanência na USM ou o retorno à origem.<br><b>RDD:</b> prazo próprio em dias corridos, contado do ingresso (Dia 1): 180, 360, 365, 730… Todo término de RDD tem avaliação própria, que não é a semestral: enquanto o preso está em RDD, a próxima avaliação é o término do RDD (se já passou e não há deliberação, aparece como vencido). A avaliação semestral por data nominal vale para a Ala Máxima: quem nunca esteve em RDD conta do ingresso; quem saiu do RDD conta 6 meses civis a partir do dia seguinte ao término do RDD (ou da data da revogação judicial/saída antecipada, quando informada). Ao vencer: Manutenção (sai do RDD para a Ala Máxima) ou Exclusão (encerra o acompanhamento).<br>Alerta: o retorno/exclusão deve ser iniciado com 30 dias de antecedência do vencimento (campo "Alerta"); a janela vale para o vencimento semestral e para o termo do RDD.<br>Sinalizar ATA marca que a deliberação do período já ocorreu; a sinalização some quando o próximo semestre vence. SGPE: SEJURI 00000000/0000 ou SAP 00000000/0000.</p></details>

let pdfjsP=null;
function pdfLoad(){if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);if(pdfjsP)return pdfjsP;const B='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';return pdfjsP=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=B+'pdf.min.js';sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js';ok(window.pdfjsLib)};sc.onerror=()=>{pdfjsP=null;no(new Error('Não foi possível carregar o leitor de PDF (verifique a conexão).'))};document.head.appendChild(sc)})}
async function pdfTexto(file){const lib=await pdfLoad(),pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise,out=[];for(let n=1;n<=pdf.numPages;n++){const pg=await pdf.getPage(n),tc=await pg.getTextContent();let y=null,ln='',ls=[],h=[];tc.items.forEach(it=>{if(!('str' in it))return;const yy=it.transform[5];if(y!==null&&Math.abs(yy-y)>2){ls.push([ln,y-yy]);ln=''}ln+=it.str;y=yy;if(it.hasEOL){ls.push([ln,0]);ln='';y=null}});if(ln)ls.push([ln,0]);let t='';ls.forEach((l,i)=>{t+=l[0].trim();const g=l[1];t+=(i<ls.length-1)?(g>20?'\n\n':'\n'):''});out.push(t.trim())}
return out.join('\n\n').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim()}
async function emqPdfs(files){const st=document.getElementById('emq_fst');const say=m=>{if(st)st.textContent=m};emRead();const ds=emqDocs();let ok=0,vazios=[];for(const f of files){if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){say('Ignorado (não é PDF): '+f.name);continue}try{say('Lendo '+f.name+'…');const t=await pdfTexto(f);const rot=f.name.replace(/\.pdf$/i,'').replace(/[_]+/g,' ');if(t.length<80)vazios.push(f.name);ds.push({rot,tipo:/delibera/i.test(f.name)?'Deliberação':'Ata',txt:t});ok++}catch(err){say('Falha ao ler '+f.name+': '+(err&&err.message||err));return}}
save();renderEmit();const st2=document.getElementById('emq_fst');if(st2)st2.textContent=ok+' PDF(s) importado(s).'+(vazios.length?' ATENÇÃO: sem texto aproveitável (provavelmente digitalizado): '+vazios.join(', ')+'.':' Confira o texto e a identificação de cada documento.')}
